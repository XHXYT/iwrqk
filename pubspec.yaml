name: iwrqk
description: "A new Flutter project."
publish_to: "none"
version: 2.2.5

environment:
  sdk: ^3.11.0-93.1.beta
  flutter: ">=3.41.9"

dependencies:
  animations: ^2.1.1

  # 音频：CPF-Flutter ohos 适配分支
  audio_service: ^0.18.18
  audio_session: ^0.2.2

  audio_video_progress_bar: ^2.0.3

  # 屏幕方向插件，ohos 上行为未验证
  auto_orientation_v2: ^2.3.7

  auto_size_text: ^3.0.0

  saver_gallery: ^4.1.2
  # background_downloader 迁移到已适配的 flutter_downloader
  flutter_downloader:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_flutter_downloader.git
      ref: br_v1.12.0_ohos

  cached_network_image: ^3.4.1
  cloudflare_interceptor: ^0.0.3
  cookie_jar: ^4.0.8
  crypto: ^3.0.7

  # device_info_plus 降到 9.x（ohos 适配分支基于 9.0.0）
  device_info_plus: ^9.0.0

  # Discord RPC：桌面专属，代码里用 Platform.isWindows||isMacOS||isLinux 包住
  dart_discord_rpc:
    git:
      url: https://gitcode.com/Ya520/dart_discord_rpc.git
      ref: "0.0.3"

  dio: ^5.9.0
  dio_cookie_manager: ^3.3.0
  dynamic_color: ^1.8.1
  easy_debounce: ^2.0.3
  easy_refresh: ^3.4.0

  # file_picker 鸿蒙适配（包名改为 file_picker_ohos）
  #   代码 import 'package:file_picker/file_picker.dart'
  #   → import 'package:file_picker_ohos/file_picker_ohos.dart'
  #   （类名 FilePicker / API 不变）
  file_picker_ohos:
    git:
      url: https://gitcode.com/hellozeronick/fluttertpc_file_picker.git
      ref: br_v10.3.8_ohos

  # floating（画中画）：先保留原版，有问题换 PiliPlus 同款 fork：
  #   git: https://github.com/qinshah/floating.git  ref: 3eefccb
  floating: ^6.0.0

  # flutter_displaymode：Android 高刷专属，鸿蒙上会抛异常，调用处加 Platform.isAndroid
  flutter_displaymode: ^0.7.0

  # 安全存储：主包 + 鸿蒙适配实现（基于 9.2.4，核心 API 与 v10 兼容）
  #   运行时报错的话把主包降级为 flutter_secure_storage: 9.2.4
  flutter_secure_storage: ^9.2.4
  flutter_secure_storage_ohos:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_flutter_secure_storage.git
      ref: 9.2.4-ohos-1.0.0
      path: flutter_secure_storage_ohos

  flutter_smart_dialog: ^4.9.8+9

  # 音量控制：ohos 支持从 2.0.1 开始
  flutter_volume_controller: ^2.0.1

  get: ^4.7.3
  get_storage: ^2.1.1
  html: ^0.15.6
  http: ^1.6.0
  intl: ^0.20.2

  # listen_sharing_intent：暂无 ohos 适配，可换官方已适配的 receive_sharing_intent
  listen_sharing_intent: ^1.9.2

  logger: ^2.6.2
  markdown_widget: ^2.3.2+8

  # media_kit：实际由下方 overrides 指到 feat-ohos 分支
  media_kit: ^1.2.2
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.0

  # open_file：原包无 ohos 实现，换成适配版 open_file_ohos（基于 3.4.0，
  #   OpenFile.open() API 一致）
  #   代码 import 'package:open_file/open_file.dart'
  #   → import 'package:open_file_ohos/open_file_ohos.dart'
  open_file_ohos:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_open_file.git
      path: "ohos"
      ref: br_3.35-3.4.0-ohos.1.0.0-beta.1

  package_info_plus: ^9.0.0
  path: ^1.9.1
  path_provider: ^2.1.5

  # 权限：鸿蒙包
  permission_handler: ^12.0.1
  # permission_handler_ohos:
  #   git:
  #     url: https://gitcode.com/CPF-Flutter/flutter_permission_handler.git
  #     path: permission_handler_ohos
  #     ref: br_permission_handler_v11.3.1_ohos
  permission_handler_ohos:
    path: ../flutter_permission_handler/permission_handler_ohos

  photo_view: ^0.15.0
  queue: ^3.4.0
  screen_brightness: ^2.1.7

  # share_plus 降到 10.1.1（ohos 分支版本），
  #   代码里 SharePlus.instance.share(ShareParams(...)) → Share.share(...) / Share.shareXFiles(...)
  share_plus: ^10.1.1

  slang: ^4.11.0
  slang_flutter: ^4.11.0
  url_launcher: ^6.3.2
  window_manager: ^0.5.1

  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0

# 鸿蒙适配核心（PiliPlus 已验证源 + CPF-Flutter 官方 TAG）
dependency_overrides:
  # ---- 音频 ----
  # audio_service：fork CPF-Flutter OHOS 移植版 + 锁屏/通知封面修复
  audio_service:
    git:
      url: https://gitcode.com/Ya520/fluttertpc_audio_service.git
      path: audio_service
      ref: ohos-cover-fix
  audio_session:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_audio_session.git
      ref: br_v0.2.2_ohos

  # ---- media_kit（ErBWs feat-ohos）----
  media_kit:
    git:
      url: https://github.com/ErBWs/media-kit.git
      ref: feat-ohos
      path: ./media_kit
  media_kit_video:
    git:
      url: https://github.com/ErBWs/media-kit.git
      ref: feat-ohos
      path: ./media_kit_video
  media_kit_libs_video:
    git:
      url: https://github.com/ErBWs/media-kit.git
      ref: feat-ohos
      path: ./libs/universal/media_kit_libs_video
  media_kit_libs_ohos:
    git:
      url: https://github.com/ErBWs/media-kit.git
      ref: feat-ohos
      path: ./libs/ohos/media_kit_libs_ohos
  media_kit_native_event_loop:
    git:
      url: https://github.com/My-Responsitories/media-kit.git
      path: media_kit_native_event_loop
      ref: version_1.2.5

  # ---- 基础插件 ----
  url_launcher:
    git:
      url: https://gitcode.com/hellozeronick/url_launcher.git
      path: url_launcher
      ref: main
  path_provider:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      path: packages/path_provider/path_provider
  share_plus:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_plus_plugins.git
      path: packages/share_plus/share_plus
      ref: br_share_plus-v10.1.1_ohos
  package_info_plus:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_plus_plugins.git
      path: packages/package_info_plus/package_info_plus
      ref: package_info_plus-9.0.0-ohos-1.0.0
  # 无固定 ref，跟踪默认分支；出错先注释掉这段
  device_info_plus:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_plus_plugins.git
      path: packages/device_info_plus/device_info_plus

  # image_picker：ohos 适配（Flutter 3.41 对应 TAG image_picker-v1.2.1-ohos-1.0.0）
  image_picker:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/image_picker/image_picker
      ref: br_image_picker-v1.2.1_ohos

  # sqflite：ohos 适配（基于 2.4.2，官方 TAG 2.4.2-ohos-1.0.0-beta.2）
  #   background_downloader 内部依赖 sqflite，加这个保运行时可用
  sqflite:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_sqflite.git
      path: sqflite
      ref: 2.4.2-ohos-1.0.0-beta.2

  permission_handler:
    path: D:/HUAWEI/DevEcoStudioProjects/FlutterProjects/flutter_permission_handler/permission_handler
  permission_handler_ohos:
    path: D:/HUAWEI/DevEcoStudioProjects/FlutterProjects/flutter_permission_handler/permission_handler_ohos

  # jni：1.0.3，补 ohosArm/ohosArm64/ohosX64 的 AbiSpecificInteger 映射（release AOT 必需）
  jni:
    git:
      url: https://gitcode.com/Ya520/jni.git
      ref: 1.0.3-ohos

flutter:
  uses-material-design: true

flutter_launcher_icons:
  ios: true
  android: true
  remove_alpha_ios: true
  image_path: "assets/launcher/icon.png"
  image_path_ios: "assets/launcher/icon.png"
  image_path_android: "assets/launcher/icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/launcher/foreground.png"
  adaptive_icon_monochrome: "assets/launcher/foreground.png"
  windows:
    generate: true
    image_path: "assets/launcher/icon.png"
  macos:
    generate: true
    image_path: "assets/launcher/icon.png"
